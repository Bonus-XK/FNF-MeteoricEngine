# macOS (x86_64 + arm64) 构建工作流 —— 可被 build.yml 编排（workflow_call），也可单独派发。
# 来源：原 build.yml 的 macos-x64 / macos-arm64 两个 job 合并为 matrix（步骤逐字保留，
# 分叉点用 if: matrix.arch 区分）。叠加：hxcpp 编译缓存（按架构分 key）+ 上传加固。
# 两架构并存的历史原因：
#   - x64 job 在 arm64 runner 上以 Rosetta 跑 x86_64 Haxe/Neko（引擎 C++ 同样 x86_64）；
#   - arm64 job 的 Haxe/Neko 也走 Rosetta，但引擎 C++ 用原生 arm64 clang；
#   - arm64 ndll 需要显式 -arm64 并把 lime-64.ndll 拷为 lime.ndll（lime 的命名约定）。
name: 构建 macOS (x86_64 + arm64)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

jobs:
  macos:
    name: macOS (${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }})
    # macos-26：macos-14 镜像 2026-11-02 退役；26 自带 MacOSX26.5.sdk（MACOSX_VER 所需），
    # Rosetta 2 在 macOS 26 仍提供（x64 job 的 x86_64 Haxe 工具链依赖它）
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: 检出代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # x64 job 的 x86_64 Haxe/Neko 工具链依赖 Rosetta 2；macos-26 镜像不保证预装
      # （Apple 已宣布弃用 Rosetta），显式装一次（已装时为幂等 no-op）
      - name: 确保 Rosetta 2 就位（x86_64 工具链依赖）
        run: |
          /usr/bin/pgrep -q oahd && echo "Rosetta 已在运行" || {
            echo "Rosetta 未安装，正在安装..."
            softwareupdate --install-rosetta --agree-to-license
          }

      - name: 安装 Haxe/Neko（Rosetta 运行 x86_64；arm64 job 的引擎 C++ 用原生 clang）
        run: bash ci/setup-haxe-ci.sh

      - name: 恢复 haxelib 依赖缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: $HOME/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('ci/install-deps.sh') }}

      - name: 安装 haxelib 依赖
        run: |
          export PATH="$HOME/haxe:$HOME/neko:$PATH"
          export NEKOPATH="$HOME/neko"
          bash ci/install-deps.sh

      # 官方 hxcpp 4.3.2 的 mac 编译器走 `xcrun --sdk macosx${MACOSX_VER}` 别名解析；
      # macos-26 镜像上别名拼法对不上（"SDK macosx26 cannot be located"，2026-11-01 实锤）。
      # 与本机 2026-10-18 的工具链补丁同思路：换绝对路径 clang++，isysroot 用 MacOSX.sdk
      # 符号链接（= xcode-select 默认 SDK），彻底摆脱 SDK 别名与版本号拼法。
      # 幂等：缓存里的 hxcpp 已打过补丁时 sed 无匹配，无副作用。
      - name: 修补 hxcpp mac 工具链（摆脱 SDK 别名解析）
        run: |
          HXCPP_DIR="$HOME/haxelib/hxcpp/4,3,2"
          sed -i '' \
            -e 's|xcrun --sdk macosx\${MACOSX_VER} clang++|/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++|g' \
            -e 's|MacOSX\${MACOSX_VER}.sdk|MacOSX.sdk|g' \
            "$HXCPP_DIR/toolchain/mac-toolchain.xml"
          echo "剩余 xcrun SDK 别名引用: $(grep -c 'xcrun --sdk macosx' "$HXCPP_DIR/toolchain/mac-toolchain.xml" || true)"
          echo "默认 SDK 引用: $(grep -c 'MacOSX.sdk' "$HXCPP_DIR/toolchain/mac-toolchain.xml" || true)"

      # hxcpp 内嵌 zlib-1.2.11 的 zutil.h 在 TARGET_OS_MAC 被预定义时启用
      # `#define fdopen(fd,mode) NULL`（2011 年老 Mac 兼容），与 Xcode 26.6/clang 21
      # 新 SDK 的 fdopen 声明相撞（"expected ')'"，2026-11-01 实锤；macos-14 的
      # clang 20 不预定义所以此前没事）。与 lime 侧同一问题同一修法：盖本仓库
      # 修好的 zutil.h（本机 2026-10-18 对本地 hxcpp 也是这么修的）。
      - name: 修补 hxcpp 内嵌 zlib 的 zutil.h（TARGET_OS_MAC/(fdopen) 冲突）
        run: |
          HXCPP_DIR="$HOME/haxelib/hxcpp/4,3,2"
          cp ci/lime-sdl3-patch/project/lib/zlib/zutil.h \
             "$HXCPP_DIR/project/thirdparty/zlib-1.2.11/zutil.h"
          grep -c "define fdopen" "$HXCPP_DIR/project/thirdparty/zlib-1.2.11/zutil.h" || echo "fdopen 宏已全部禁用"

      - name: 恢复 SDL3 lime 源码树缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/lime-full
          key: limefull-${{ runner.os }}-macos-${{ matrix.arch }}-${{ hashFiles('ci/setup-lime-sdl3.sh', 'ci/lime-sdl3-patch/**') }}

      - name: 组装 SDL3 lime（缓存未命中才现场组装）
        run: |
          export PATH="$HOME/haxe:$HOME/neko:$PATH"
          export NEKOPATH="$HOME/neko"
          if [ -d /tmp/lime-full/project ]; then
            echo "==> lime-full 缓存命中，跳过组装，仅关联 dev"
            haxelib dev lime /tmp/lime-full
          else
            GH_PROXY="" bash ci/setup-lime-sdl3.sh
          fi

      - name: 重建 lime macOS ndll（x86_64）
        if: matrix.arch == 'x64'
        run: |
          export PATH="$HOME/haxe:$HOME/neko:$PATH"
          export NEKOPATH="$HOME/neko"
          cd /tmp/lime-full
          neko run.n rebuild lime mac

      - name: 重建 lime macOS ndll（arm64）
        if: matrix.arch == 'arm64'
        run: |
          export PATH="$HOME/haxe:$HOME/neko:$PATH"
          export NEKOPATH="$HOME/neko"
          cd /tmp/lime-full
          neko run.n rebuild lime mac -arm64
          cp ndll/MacArm64/lime-64.ndll ndll/MacArm64/lime.ndll

      # key 含 lime 树哈希：lime 头文件一变，引擎 C++ 全量重编，缓存整体换代
      - name: 恢复 hxcpp 编译缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .hxcpp-cache
          key: hxcpp-macos-${{ matrix.arch }}-v1-${{ hashFiles('ci/setup-lime-sdl3.sh', 'ci/lime-sdl3-patch/**', 'ci/install-deps.sh', 'source/**/*.hx', 'Project.xml') }}
          restore-keys: |
            hxcpp-macos-${{ matrix.arch }}-v1-

      # 构建输出 tee 落盘；失败时把错误转 ::error:: 注解（公开 API 可读，日志接口拿不到）
      - name: 构建 macOS x86_64
        if: matrix.arch == 'x64'
        run: |
          set -o pipefail
          ./compile-mac.sh 2>&1 | tee /tmp/mac-build.log

      - name: 构建 macOS arm64
        if: matrix.arch == 'arm64'
        run: |
          export PATH="$HOME/haxe:$HOME/neko:$PATH"
          export NEKOPATH="$HOME/neko"
          set -o pipefail
          haxelib run lime build macos -release -arm64 2>&1 | tee /tmp/mac-build.log

      - name: 失败时提取编译错误到注解
        if: failure()
        run: |
          grep -i -B2 -A6 "error" /tmp/mac-build.log 2>/dev/null | tail -60 \
            | tr '\n' '\001' | sed 's/\x01/ ⏎ /g' | fold -w 850 | tail -8 \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line}"
              done
          tail -40 /tmp/mac-build.log 2>/dev/null \
            | tr '\n' '\001' | sed 's/\x01/ ⏎ /g' | fold -w 850 | tail -2 \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::[tail] ${line}"
              done
          exit 0

      - name: ad-hoc 签名
        run: codesign --force --deep -s - export/release/macos/bin/Meteoric.app

      - name: 归档
        run: |
          rm -rf export/release/macos-${{ matrix.arch }}
          mkdir -p export/release/macos-${{ matrix.arch }}
          cp -R export/release/macos/bin/Meteoric.app export/release/macos-${{ matrix.arch }}/

      - name: 上传
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: meteoric-macos-${{ matrix.arch }}
          path: export/release/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
