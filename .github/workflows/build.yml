# ============================================================
# Meteoric Engine 全端构建编排器
# 触发: push / pull_request / 手动（workflow_dispatch）
# 构建: Android / Windows x64+x86 / macOS x86_64+arm64 / Linux x86_64 / iOS 未签名 IPA
#
# 结构（2026-11，Seiun Engine 式拆分）:
#   - 各平台构建拆到 .github/workflows/build-{android,windows,macos,linux,ios}.yml
#     （workflow_call 可复用 + 可单独手动派发），本文件只做编排与发布；
#   - hxcpp 编译缓存（HXCPP_COMPILE_CACHE）在各平台 workflow 内，跨 run 增量编译；
#   - Windows 额外产出崩溃符号 artifact（.map + 配对 exe + build-info，90 天），
#     供 CrashHandler 的 native_crash 报告做符号化定位；
#   - 构建全部成功后自动发布 Pre-release（PR 不发布），产物带版本号 + SHA256SUMS。
#   - Linux / iOS 是 SDL3 移植观察期新增端：continue-on-error 非阻塞 + 发布产物可选，
#     首个绿灯后把 linux/ios 加进 release.needs 并去掉可选逻辑。
#
# 历史提速要点（2026-08，保留）:
#   1) haxelib 依赖与 /tmp/lime-full（SDL3 lime 源码树）进 actions/cache；
#   2) macOS 拆成 x64 / arm64 两个并行矩阵 job；
#   3) setup-lime-sdl3.sh 网络重试收紧。
# 中国镜像（Gitee 镜像 + 加速域名注入 release 说明）：待建仓后接入，见 release 说明模板留桩。
# ============================================================
name: 构建（Build）

# 同一分支的工作流按序排队（不前后叠加占用 runner；release 手动触发也保留排队语义）
concurrency:
  # 新推送自动取消同一分支上**上一个**还在跑/排队的构建（不空耗 runner）。
  # 手动派发（发布用 workflow_dispatch）走独立 group，不会被普通推送误取消。
  group: build-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则自动读取 source/Main.hx 的 meVersion）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Android (arm64)
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  windows:
    name: Windows (x64 + x86)
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  macos:
    name: macOS (x86_64 + arm64)
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  # ---------- Linux / iOS（2026-11-02 转正） ----------
  # SDL3 移植观察期结束：两端连续绿灯且产物已随 v1.2.0-20261102-0728 发布，
  # 现为发布阻塞端（continue-on-error 已随转正移除）。
  linux:
    name: Linux (x86_64)
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  ios:
    name: iOS (未签名 IPA)
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit

  # ---------- 发布 Pre-release ----------
  # 五个平台全部成功后自动创建 GitHub Pre-release（PR 不发布）。
  release:
    name: 发布 Pre-release
    needs: [android, windows, macos, linux, ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出代码（读取 source/Main.hx 版本号）
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 确定版本号（优先手动输入，否则读 source/Main.hx 的 meVersion；统一追加构建日期）
        id: version
        run: |
          BASE="${{ github.event.inputs.version }}"
          if [ -z "$BASE" ]; then
            BASE="$(sed -n "s/.*meVersion:String = '\([^']*\)'.*/\1/p" source/Main.hx | head -1)"
          fi
          if [ -z "$BASE" ]; then
            BASE="0.0.0"
          fi
          VERSION="${BASE}-$(TZ='Asia/Shanghai' date +%Y%m%d-%H%M)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "发布版本: v$VERSION"

      - name: 下载全部构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release-artifacts

      - name: 校验产物清单
        run: |
          find release-artifacts -maxdepth 2 | sort
          test -f release-artifacts/meteoric-android-arm64/Meteoric-debug.apk
          test -f release-artifacts/meteoric-windows-x64/Meteoric.exe
          test -f release-artifacts/meteoric-windows-x86/Meteoric.exe
          test -d release-artifacts/meteoric-macos-x64/Meteoric.app
          test -d release-artifacts/meteoric-macos-arm64/Meteoric.app
          test -f release-artifacts/meteoric-linux-x64/Meteoric-Linux-x64.tar.gz
          test -f release-artifacts/meteoric-ios/Meteoric-iOS-unsigned.ipa
          echo "七端产物齐全 ✓"

      - name: 打包产物（zip/apk 单文件；自标识命名 <平台>-<版本>）
        run: |
          set -e
          mkdir -p dist
          cp release-artifacts/meteoric-android-arm64/Meteoric-debug.apk "dist/Meteoric-Android-arm64-$VERSION.apk"
          (cd release-artifacts/meteoric-windows-x64 && zip -qry "../../dist/Meteoric-Windows-x64-$VERSION.zip" .)
          (cd release-artifacts/meteoric-windows-x86 && zip -qry "../../dist/Meteoric-Windows-x86-$VERSION.zip" .)
          (cd release-artifacts/meteoric-macos-x64 && zip -qry "../../dist/Meteoric-macOS-x86_64-$VERSION.zip" Meteoric.app)
          (cd release-artifacts/meteoric-macos-arm64 && zip -qry "../../dist/Meteoric-macOS-arm64-$VERSION.zip" Meteoric.app)
          cp release-artifacts/meteoric-linux-x64/Meteoric-Linux-x64.tar.gz "dist/Meteoric-Linux-x64-$VERSION.tar.gz"
          cp release-artifacts/meteoric-ios/Meteoric-iOS-unsigned.ipa "dist/Meteoric-iOS-unsigned-$VERSION.ipa"
          # SHA256 校验和（Seiun 式自校验发布：用户下载后可核对完整性）
          (cd dist && sha256sum $(ls | grep -v '^SHA256SUMS\.txt$') > SHA256SUMS.txt)
          ls -la dist/

      - name: 发布 Pre-release（同名旧版先删除，实现覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          # 中国镜像留桩：建好 Gitee 镜像仓 / 加速域名后，在此向说明追加镜像链接
          # （参照 Seiun 的 append-mirror-links composite action 做法）。
          # 平台清单（五端全为发布阻塞端）
          NOTES=/tmp/release-notes.md
          {
            printf 'Meteoric Engine 自动构建预发布版\n\n包含平台：\n'
            printf -- '- Windows x64 / Windows x86（zip，解压即用）\n'
            printf -- '- macOS x86_64 / macOS arm64（zip 内含 Meteoric.app）\n'
            printf -- '- Android arm64（APK）\n'
            printf -- '- Linux x86_64（tar.gz，解压后运行 bin/Meteoric；视频支持暂缺）\n'
            printf -- '- iOS（未签名 IPA，AltStore/Sideloadly 侧载自动重签）\n'
            printf '\nSHA256 见 SHA256SUMS.txt\n\n构建信息：commit %s · run %s/%s\n' \
              "${{ github.sha }}" "${{ github.run_id }}" "${{ github.run_attempt }}"
          } > "$NOTES"
          gh release create "v$VERSION" \
            --prerelease \
            --title "Pre-release v$VERSION" \
            --notes-file "$NOTES" \
            dist/*
          echo "已发布: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
